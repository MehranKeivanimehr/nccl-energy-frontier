# Planned full sweep: 3 collectives x {2, 4, 8} GPUs x 1 KiB..1 GiB x
# 3 algorithms x 4 protocols, with 5 randomized trial blocks.
name: full
seed: 20261006
trials: 5
output_root: data/raw

nccl_tests:
  src_dir: third_party/nccl-tests
  build_dir: third_party/nccl-tests/build
  nccl_lib_dir: third_party/nccl_home/lib
  cuda_home: /usr/local/cuda-12.4
  datatype: float
  op: sum
  extra_env:
    # Connect channels during communicator initialization so connection setup
    # remains outside the measured collective regions.
    NCCL_RUNTIME_CONNECT: "0"

collectives: [all_reduce, all_gather, reduce_scatter]

# GPU indices are NVML / nvidia-smi indices (PCI bus order). CUDA_VISIBLE_DEVICES
# is set to the corresponding UUIDs with CUDA_DEVICE_ORDER=PCI_BUS_ID.
gpu_sets:
  - {name: 2gpu_nvlink, gpus: [4, 5], numa_bind: 1}
  - {name: 4gpu, gpus: [4, 5, 6, 7], numa_bind: 1}
  # All eight GPUs span both NUMA nodes. The set is skipped automatically (and
  # the reason recorded in gpu_set_status.json) if any of its GPUs has a
  # process on it when the run starts; it is never run on top of another job.
  - {name: 8gpu, gpus: [0, 1, 2, 3, 4, 5, 6, 7]}

sizes:
  min_bytes: 1024          # 1 KiB
  max_bytes: 1073741824    # 1 GiB
  factor: 2

algorithms: [default, Ring, Tree]
protocols: [default, Simple, LL, LL128]

timing:
  min_region_s: 2.0        # every timed region must last >= 2 s (timed iterations only)
  target_region_s: 2.2     # iteration count is sized from calibration to hit this
  warmup_s: 0.1            # warm-up iterations inside each region (nccl-tests -w)
  min_iters: 5
  min_warmup_iters: 1
  max_retries_short: 1
  wall_vs_reported_tol: 0.10
  launch_timeout_min_s: 120
  launch_timeout_factor: 4
  probe_timeout_s: 600

calibration:
  small_max_bytes: 1048576
  small_iters: 200
  small_warmup: 20
  large_iters: 5
  large_warmup: 1

sampler:
  period_s: 0.05           # PowerUsage updates every ~100 ms under load on this GPU
  proc_period_s: 1.0

idle:
  duration_s: 10
  settle_timeout_s: 180
  min_settle_s: 5
  every_n_launches: 150

foreign_process:
  wait_s: 1800
  poll_s: 30
